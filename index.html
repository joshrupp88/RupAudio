<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RupAudio Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="site-icons/RupAudio-Logo.png">
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="toolbar.css">
    <link rel="stylesheet" href="nav-panel.css">

    <!-- Supabase JS CDN library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="general.js" defer></script>
    <script src="homepage.js" defer></script>
    <script src="auth.js" defer></script> <!-- Load this last so all helper functions are already defined -->
</head>
<body>

    <header id="Toolbar" class="toolbar">
        <a id="Site-Logo" class="site-logo-section" href="https://books.rupaudio.com">
            <img
            src="site-icons/RupAudio-CompanyLogo-Small.png"
            alt="RupAudio company logo"
            width="60" height="25"> <!-- Prevents the site logo icon from rendering huge at first -->
        </a>

        <div id="Search-Section" class="search-section">
            <div id="Search-Container">
                <input
                    type="text"
                    id="Search-Bar"
                    class="search-bar"
                    placeholder="Search books, songs, authors..."
                    autocomplete="off" 
                    autocapitalize="off" 
                    spellcheck="false">
                <button
                    type="button"
                    id="Search-Btn"
                    class="search-btn">
                    <img
                        src="site-icons/search-icon.png"
                        alt="search icon"
                        width="30" height="30">
                </button>
            </div>
        </div>

        <div id="User-Profile-Section" class="user-profile-section">
            <button
                id="Notifications-Btn"
                class="hidden"
                title="Notifications"
                aria-controls="Notifications-Tooltip">
                <img
                    src="site-icons/notifications-icon.png"
                    alt="notifications icon"
                    width="40" height="40">
            </button>

            <div id="Notifications-Tooltip" class="user-profile-tooltip hidden">

            </div>

            <button
                id="User-Profile-Btn"
                title="User Profile"
                aria-controls="User-Profile-Tooltip">
                <img
                    id="Toolbar-Avatar"
                    src="site-icons/user-profile-icon.png"
                    alt="user profile icon"
                    width="40" height="40">
            </button>

            <div id="User-Profile-Tooltip" class="user-profile-tooltip hidden" aria-hidden="true" tabindex="-2">
                <div id="User-Fullname">You are not signed in</div>
                <div id="User-Email" class="hidden"></div>
                <img
                    src="site-icons/horizontal-line-icon.png"
                    alt="horizontal line icon"
                    width="40" height="5">
                <a id="Account-Settings" class="hidden" href="profile.html">Account Settings</a>
                <button id="SignInOut-Btn">Sign In</button>
            </div>
        </div>
    </header>


    <nav id="Nav-Panel" class="collapsed" tabindex="-3">
        <div id="Nav-Tabs" class="nav-tabs">
            <button
                type="button"
                id="Nav-Toggle-Btn"
                class="nav-btn collapsed"
                aria-expanded="false"
                aria-controls="Nav-Panel">
                <svg class="btn-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                
                <span class="btn-text">Show/Hide Menu</span>
            </button>

            <a href="index.html"
                id="Home-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/home-icon.png"
                alt="home icon"
                width="40" height="40">
                
                <span class="btn-text">Public Domain</span>
            </a>

            <a href=""
                id="Library-Btn"
                class="nav-btn collapsed hidden"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/library-icon.png"
                alt="library icon"
                width="40" height="40">
                
                <span class="btn-text">Library</span>
            </a>

            <a href=""
                id="Social-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/social-icon.png"
                alt="social icon"
                width="40" height="40">
                
                <span class="btn-text">Community</span>
            </a>

            <a href="upload.html"
                id="Upload-Btn"
                class="nav-btn collapsed hidden"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/upload-icon.png"
                alt="upload icon"
                width="40" height="40">
                
                <span class="btn-text">Upload Content</span>
            </a>
        </div>

        <div id="Info Tabs" class="info-tabs">
            <a href=""
                id="Info-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/info-icon.png"
                alt="info icon"
                width="40" height="40">
                
                <span class="btn-text">Need Help?</span>
            </a>

            <a href=""
                id="Suggestion-Btn"
                class="nav-btn collapsed hidden"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/idea-icon.png"
                alt="idea icon"
                width="40" height="40">
                
                <span class="btn-text">Got Feedback?</span>
            </a>
        </div>
    </nav>


    <main id="Content-Panel" class="content-panel" tabindex="-1">
        This is the content panel
    </main>

</body>
</html>
