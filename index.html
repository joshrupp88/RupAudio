<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupAudio Home</title>
    <link rel="icon" type="image/png" href="site-icons/RupAudio-Logo.png">
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="toolbar.css">
    <link rel="stylesheet" href="nav-panel.css">
    <script src="homepage.js" defer></script>
</head>
<body>

    <header id="Toolbar" class="toolbar">
        <a id="Site-Logo" class="site-logo-section" href="https://books.rupaudio.com">
            <img
            src="site-icons/RupAudio-Logo.png"
            alt="RupAudio site logo"
            width="30" height="30"> <!-- Prevents the site logo icon from rendering huge at first -->
            <h1>RupAudio</h1>
        </a>

        <div id="Search-Section" class="search-section">
            <div id="Search-Container">
                <input
                    type="text"
                    id="Search-Bar"
                    class="search-bar"
                    placeholder="Search...">
                <button
                    type="button"
                    id="Search-Btn"
                    class="search-btn">
                    <img
                        src="site-icons/search-icon.png"
                        alt="search icon"
                        width="40" height="40">
                </button>
            </div>
        </div>

        <div id="User-Profile-Section" class="user-profile-section">
            <a href=""
                id="Notifications-Button">
                <img
                    src="site-icons/notifications-icon.png"
                    alt="notifications icon"
                    width="40" height="40">
            </a>

            <a href=""
                id="User-Profile-Button">
                <img
                    src="site-icons/user-profile-icon.png"
                    alt="user profile icon"
                    width="40" height="40">
            </a>
        </div>
    </header>


    <nav id="Nav-Panel" class="hidden" aria-hidden="true">
        <div id="Nav-Tabs" class="nav-tabs">
            <button
                type="button"
                id="Nav-Toggle-Btn"
                class="nav-btn collapsed"
                aria-expanded="false"
                aria-controls="Nav-Panel">
                <svg class="btn-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                
                <span class="btn-text">Show/Hide Menu</span>
            </button>

            <a href=""
                id="Library-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/library-icon.png"
                alt="library icon">
                
                <span class="btn-text">Library</span>
            </a>

            <a href=""
                id="Social-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/social-icon.png"
                alt="social icon">
                
                <span class="btn-text">Community</span>
            </a>

            <a href=""
                id="Upload-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/upload-icon.png"
                alt="upload icon">
                
                <span class="btn-text">Upload Content</span>
            </a>
        </div>

        <div id="Info Tabs" class="info-tabs">
            <a href=""
                id="Info-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/info-icon.png"
                alt="info icon">
                
                <span class="btn-text">Need Help?</span>
            </a>

            <a href=""
                id="Suggestion-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/idea-icon.png"
                alt="idea icon">
                
                <span class="btn-text">Got Feedback?</span>
            </a>
        </div>
    </nav>


    <main id="Content-Panel" class="content-panel">
        This is the content panel
    </main>

</body>
</html>
