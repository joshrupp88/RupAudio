<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RupAudio Login</title>
    
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="reset-password.css">
    <link rel="icon" type="image/png" href="site-icons/RupAudio-Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Supabase JS CDN library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js" defer></script>
</head>
<body>
    <div id="Header-Section" class="header-section">
        <img
            src="site-icons/RupAudio-CompanyLogo-FullSize.png"
            alt="RupAudio site logo"
            width="300" height="150">
        <h1 id="Welcome-Message" class="welcome-message">
            Forgot your password? No problem!
        </h1>
    </div>

    <main class="root-window">
        <div id="SignInUp-Toggle" class="toggle">
            <button
                id="Sign-In-Toggle"
                class="toggle-button selected lora-bold"
                >Reset Password</button>
        </div>

        <form id="Reset-Section" class="section">
            <div class="input-container">
                <input
                    id="New-Pw"
                    type="password"
                    alt="email address field"
                    placeholder="New Password"
                    autocomplete="off" 
                    autocapitalize="off" 
                    spellcheck="false">
                <button type="button" id="New-Pw-Toggle" tabindex="-1">
                    <img src="site-icons/password-reveal-icon.png" alt="reveal password icon">
                </button>
            </div>
            
            <div class="input-container">
                <input
                    id="Confirm-Pw"
                    type="password"
                    alt="password field"
                    placeholder="Confirm Password"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false">
                <button type="button" id="Confirm-Pw-Toggle" tabindex="-1">
                    <img src="site-icons/password-reveal-icon.png" alt="reveal password icon">
                </button>
            </div>
                
            <p id="Status-Message" class="status-message hidden"></p>
            <button id="Confirm-Btn" type="submit" class="button">Confirm</button>
        </form>
    </main>
</body>
</html>
