<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RupAudio Profile Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="site-icons/RupAudio-Logo.png">
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="toolbar.css">
    <link rel="stylesheet" href="nav-panel.css">

    <!-- Supabase JS CDN library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="general.js" defer></script>
    <script src="profile.js" defer></script>
    <script src="auth.js" defer></script>
</head>
<body>

    <header id="Toolbar" class="toolbar">
        <a id="Site-Logo" class="site-logo-section" href="https://books.rupaudio.com">
            <img
            src="site-icons/RupAudio-CompanyLogo-Small.png"
            alt="RupAudio company logo"
            width="60" height="25"> <!-- Prevents the site logo icon from rendering huge at first -->
        </a>

        <div id="Search-Section" class="search-section">
            <div id="Search-Container">
                <input
                    type="text"
                    id="Search-Bar"
                    class="search-bar"
                    placeholder="Search books, songs, authors..."
                    autocomplete="off" 
                    autocapitalize="off" 
                    spellcheck="false">
                <button
                    type="button"
                    id="Search-Btn"
                    class="search-btn">
                    <img
                        src="site-icons/search-icon.png"
                        alt="search icon"
                        width="30" height="30">
                </button>
            </div>
        </div>

        <div id="User-Profile-Section" class="user-profile-section">
            <button
                id="Notifications-Btn"
                class="hidden"
                title="Notifications"
                aria-controls="Notifications-Tooltip">
                <img
                    src="site-icons/notifications-icon.png"
                    alt="notifications icon"
                    width="40" height="40">
            </button>

            <div id="Notifications-Tooltip" class="user-profile-tooltip hidden">

            </div>

            <button
                id="User-Profile-Btn"
                title="User Profile"
                aria-controls="User-Profile-Tooltip">
                <img
                    id="Toolbar-Avatar"
                    src="site-icons/user-profile-icon.png"
                    alt="user profile icon"
                    width="40" height="40">
            </button>

            <div id="User-Profile-Tooltip" class="user-profile-tooltip hidden" aria-hidden="true" tabindex="-2">
                <div id="User-Fullname">You are not signed in</div>
                <div id="User-Email" class="hidden"></div>
                <img
                    src="site-icons/horizontal-line-icon.png"
                    alt="horizontal line icon"
                    width="40" height="5">
                <a id="Account-Settings" class="hidden" href="profile.html">Account Settings</a>
                <button id="SignInOut-Btn">Sign In</button>
            </div>
        </div>
    </header>


    <nav id="Nav-Panel" class="collapsed" tabindex="-3">
        <div id="Nav-Tabs" class="nav-tabs">
            <button
                type="button"
                id="Nav-Toggle-Btn"
                class="nav-btn collapsed"
                aria-expanded="false"
                aria-controls="Nav-Panel">
                <svg class="btn-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                
                <span class="btn-text">Show/Hide Menu</span>
            </button>

            <a href="index.html"
                id="Home-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/home-icon.png"
                alt="home icon"
                width="40" height="40">
                
                <span class="btn-text">Public Domain</span>
            </a>

            <a href=""
                id="Library-Btn"
                class="nav-btn collapsed hidden"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/library-icon.png"
                alt="library icon"
                width="40" height="40">
                
                <span class="btn-text">Library</span>
            </a>

            <a href=""
                id="Social-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/social-icon.png"
                alt="social icon"
                width="40" height="40">
                
                <span class="btn-text">Community</span>
            </a>

            <a href="upload.html"
                id="Upload-Btn"
                class="nav-btn collapsed hidden"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/upload-icon.png"
                alt="upload icon"
                width="40" height="40">
                
                <span class="btn-text">Upload Content</span>
            </a>
        </div>

        <div id="Info Tabs" class="info-tabs">
            <a href=""
                id="Info-Btn"
                class="nav-btn collapsed"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/info-icon.png"
                alt="info icon"
                width="40" height="40">
                
                <span class="btn-text">Need Help?</span>
            </a>

            <a href=""
                id="Suggestion-Btn"
                class="nav-btn collapsed hidden"
                aria-expanded="false">
                <img
                class="btn-icon"
                src="site-icons/idea-icon.png"
                alt="idea icon"
                width="40" height="40">
                
                <span class="btn-text">Got Feedback?</span>
            </a>
        </div>
    </nav>


    <main id="Content-Panel" class="content-panel" tabindex="-1">
        <p id="Status-Message" class="status-message hidden"></p>

        <div id="Info-Section" class="section info-section">
            <header class="lora-bold">User Information</header>
            <div class="avatar-section">
                <img
                    id="User-Avatar"
                    src="site-icons/user-profile-icon.png"
                    alt="user profile icon"
                    width="150"
                    height="150">
                <button id="Profile-Pic-Btn" class="profile-button">
                    <img src="site-icons/edit-icon.png" alt="edit-icon" width="20" height="20">
                    <span class="lora-plain">Change Profile Picture</span>
                </button>
                <input
                    id="Avatar-Input"
                    type="file"
                    accept="image/*"
                    class="hidden">
            </div>
            
            <div class="user-details-section">

                <span class="lora-bold">First Name</span>
                <div class="user-details-container">
                    <input
                        id="First-Name-Input"
                        type="text"
                        class="user-details-input lora-italic"
                        value="Loading profile data..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false">
                    <button id="First-Name-Btn" class="edit-button">
                        <img src="site-icons/edit-icon.png" alt="edit-icon" width="20" height="20">
                        <span class="lora-plain">Change</span>
                    </button>
                </div>
                <span class="lora-bold">Last Name</span>
                <div class="user-details-container">
                    <input
                        id="Last-Name-Input"
                        type="text"
                        class="user-details-input lora-italic"
                        value="Loading profile data..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false">
                    <button id="Last-Name-Btn" class="edit-button">
                        <img src="site-icons/edit-icon.png" alt="edit-icon" width="20" height="20">
                        <span class="lora-plain">Change</span>
                    </button>
                </div>

                <span class="lora-bold">Email Address</span>
                <div class="user-details-container">
                    <input
                        id="Email-Input"
                        type="text"
                        class="user-details-input lora-italic"
                        value="Loading profile data..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false">
                    <button id="Email-Btn" class="edit-button">
                        <img src="site-icons/edit-icon.png" alt="edit-icon" width="20" height="20">
                        <span class="lora-plain">Change</span>
                    </button>
                </div>
                <span class="lora-bold">Username</span>
                <input
                    type="text"
                    id="Username"
                    title="This is unique and static. It cannot be changed."
                    class="username lora-italic"
                    value="Loading profile data..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    readonly>
                </input>
                
            </div>
        </div>

        <div id="Bio-Section" class="section bio-section">
            <header class="lora-bold">About Me</header>
            <div class="prompt-section">
                <span class="lora-bold">Describe yourself to other RupAudio listeners!</span>
                <button id="Bio-Btn" class="profile-button">
                    <img src="site-icons/edit-icon.png" alt="edit-icon" width="20" height="20">
                    <span class="lora-plain">Confirm</span>
                </button>
            </div>
            <textarea
                id="Bio-Input"
                class="bio-input lora-italic"
                rows="6"
                maxlength="400"
                placeholder="Share something about yourself and your reading interests..."></textarea>
        </div>

        <div id="Security-Section" class="section security-section">
            <header class="lora-bold">Security</header>
            <div id="Security-Top-Section">
                <div id="Current-PW-Section" class="pw-section">
                    <span class="lora-bold">Current Password</span>
                    <div class="pw-container">
                        <input id="PW-Input-1" type="password">
                        <button id="PW-Toggle-1" tabindex="-1">
                            <img
                                src="site-icons/password-reveal-icon.png"
                                alt="password reveal icon"
                                width="20" height="20">
                        </button>
                    </div>
                </div>
            </div>

            <div id="Security-Bottom-Section">
                <div id="New-PW-Section" class="pw-section">
                    <span class="lora-bold">New Password</span>
                    <div class="pw-container">
                        <input id="PW-Input-2" type="password">
                        <button id="PW-Toggle-2" tabindex="-1">
                            <img
                                src="site-icons/password-reveal-icon.png"
                                alt="password reveal icon"
                                width="20" height="20">
                        </button>
                    </div>
                </div>
                <div id="Confirm-PW-Section" class="pw-section">
                    <span class="lora-bold">Confirm New Password</span>
                    <div class="pw-container">
                        <input id="PW-Input-3" type="password">
                        <button id="PW-Toggle-3" tabindex="-1">
                            <img
                                src="site-icons/password-reveal-icon.png"
                                alt="password reveal icon"
                                width="20" height="20">
                        </button>
                    </div>
                    <button id="Update-PW-Btn" class="profile-button">
                        <img src="site-icons/edit-icon.png" alt="edit-icon" width="20" height="20">
                        <span class="lora-plain">Update Password</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
