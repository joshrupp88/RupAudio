<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RupAudio Login</title>
    
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="site-icons/RupAudio-Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Supabase JS CDN library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js" defer></script>
</head>
<body>
    <div id="Header-Section" class="header-section">
        <img
            src="site-icons/RupAudio-CompanyLogo-FullSize.png"
            alt="RupAudio site logo"
            width="300" height="150">
        <h1 id="Welcome-Message" class="welcome-message">
            Sign in or create an account to gain access to all site features!
        </h1>
    </div>

    <main class="root-window">
        <div id="SignInUp-Toggle" class="toggle">
            <button
                id="Sign-In-Toggle"
                class="toggle-button selected"
                >Sign In</button>
            <button
                id="Sign-Up-Toggle"
                class="toggle-button"
                >Sign Up</button>
        </div>

        <form id="SignInUp-Section" class="section">
            <input
                id="Email-Input"
                type="text"
                alt="email address field"
                placeholder="Email address"
                autocomplete="off" 
                autocapitalize="off" 
                spellcheck="false">
            <input
                id="Password-Input"
                type="password"
                alt="password field"
                placeholder="Password"
                autocomplete="off" 
                autocapitalize="off" 
                spellcheck="false">
            <button
                id="Forgot-Btn"
                type="button"
                class="forgot-button">
                Forgot password?
            </button>
            <input
                id="Firstname-Input"
                type="text"
                alt="first name field"
                placeholder="First name"
                class="hidden"
                autocomplete="off" 
                autocapitalize="off" 
                spellcheck="false">
            <input
                id="Lastname-Input"
                type="text"
                alt="last name field"
                placeholder="Last name"
                class="hidden"
                autocomplete="off" 
                autocapitalize="off" 
                spellcheck="false">
            <p id="Status-Message" class="status-message hidden"></p>
            <button id="Confirm-Btn" type="submit" class="confirm-button">Confirm</button>
        </form>
    </main>
</body>
</html>
